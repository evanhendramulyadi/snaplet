<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaplet - Photobooth Website</title>
    
    <link rel="icon" type="image/png" href="img/logo-snaplet.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="main-wrapper">
        <header>
            <div class="navbar-container">
                <img src="img/logo-snaplet.png" alt="Snaplet Logo" class="logo">
                <nav>
                    <ul>
                        <li><a href="#" class="active">Home</a></li>
                        <li><a href="#">How to Use</a></li>
                        <li><a href="#">About</a></li>
                    </ul>
                </nav>
                <img src="img/logo-clario.png" alt="Clario Logo" class="logo">
            </div>
        </header>

        <main class="hero">
            <h1>Welcome to Snaplet!</h1>
            <p class="subtitle">A Photobooth Website to Capture Your Moments.</p>
            
            <div class="cta-section">
                <p class="cta-instruction">Click the Start button below to begin the photobooth!</p>
                <button id="startBtn" class="btn-start">Start Photobooth</button>
                <p class="help-text">Want to know how to use Snaplet more clearly? <a href="#">Click here.</a></p>
            </div>
        </main>

        <footer>
            <p class="made-by">Made by Clario.</p>
            <div class="footer-line"></div>
            <p class="copyright">&copy; 2026–Present Clario. All Rights Reserved.</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
