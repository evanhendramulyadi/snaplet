<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>Choose Frame - Snaplet</title>

    <script>
        // Redirect to 404 if accessed with an invalid path (e.g. typos, trailing slash/dot)
        if (window.location.protocol !== 'file:') {
            const p = window.location.pathname;
            const u = window.location.href.split('?')[0].split('#')[0];
            if ((p !== '/choose_frame' && p !== '/choose_frame.html' && p !== '/snaplet/choose_frame' && p !== '/snaplet/choose_frame.html') || u.endsWith('.') || u.endsWith('/.')) {
                window.location.replace('404.html');
            }
        }
    </script>

    <link rel="icon" type="image/png" href="img/snaplet-logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="selection-body">

    <div class="main-wrapper">
        <main class="hero">
            <div class="selection-container">
                <h1 class="selection-title">Choose the frame you want for your photobooth!</h1>
                
                <div class="frame-grid">
                    <div class="frame-item" onclick="saveFrame('frame-overlay-1')">
                        <img src="img/frame-preview-1.png" alt="Yellow sunflower photo frame preview">
                    </div>
                    <div class="frame-item" onclick="saveFrame('frame-overlay-2')">
                        <img src="img/frame-preview-2.png" alt="Classic black photo frame preview">
                    </div>
                    <div class="frame-item" onclick="saveFrame('frame-overlay-3')">
                        <img src="img/frame-preview-3.png" alt="Retro pixel blue and green photo frame preview">
                    </div>
                    <div class="frame-item" onclick="saveFrame('frame-overlay-4')">
                        <img src="img/frame-preview-4.png" alt="Pastel sea creatures photo frame preview">
                    </div>
                </div>

                <div class="action-area">
                    <a href="index.html" class="btn-cancel-return">Cancel and Return to Home</a>
                </div>
            </div>
        </main>

        <footer class="selection-footer">
            <div class="footer-line"></div>
            <p class="copyright">&copy; 2026–Present Clario. All Rights Reserved.</p>
        </footer>
    </div>

    <script src="js/script.js"></script>
    
</body>
</html>
